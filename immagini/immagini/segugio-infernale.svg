  <!-- collo e testa -->
  <path d="M190 252 C176 220 170 190 176 160 L250 150 C262 180 260 220 248 250 Z" fill="url(#nero)"/>
  <path d="M110 170 C110 130 140 104 182 102 C222 100 254 120 258 156 C262 186 238 206 206 210 L150 214 C124 214 110 196 110 170 Z" fill="url(#nero2)"/>
  <!-- orecchie -->
  <path d="M182 108 L176 54 L214 98 Z M222 112 L238 62 L250 124 Z" fill="#2a201c"/>
