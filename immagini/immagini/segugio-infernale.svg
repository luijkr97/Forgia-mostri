  <path d="M110 168 C86 170 60 178 50 194 C70 200 96 198 116 192 Z" fill="url(#nero2)"/>
  <path d="M116 196 C96 204 72 214 62 230 C86 234 120 224 150 214 Z" fill="url(#nero)"/>
  <path d="M54 196 L66 206 L74 196 L84 206 L92 196 L102 204 L110 196" fill="#f2ead6" stroke-width="1.6"/>
  <path d="M64 226 L74 214 L84 224 L94 212 L104 222 L114 210" fill="#f2ead6" stroke-width="1.6"/>
  <path d="M52 204 C30 196 14 200 4 210 C20 214 26 222 18 236 C36 228 46 226 60 220 Z" fill="url(#fiamma)" stroke-width="2"/>
  <circle cx="58" cy="182" r="6" fill="#1a120c"/>
  <!-- occhio di brace -->
  <path d="M150 140 C162 128 182 130 188 142 C176 150 160 150 150 140 Z" fill="url(#brace)"/>
  <circle cx="170" cy="141" r="3" fill="#1a120c" stroke="none"/>
  <path d="M144 128 C160 118 180 120 192 132" fill="none" stroke-width="3.6"/>
 </g>
</svg>
