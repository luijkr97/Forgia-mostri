<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
 <!-- Segnaposto disegnato per Esterno · Quadrupede non buono: segugio infernale. Da sostituire con l'illustrazione ufficiale. -->
 <defs>
  <radialGradient id="carta" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#efe2c2"/><stop offset=".75" stop-color="#e6d6b4"/><stop offset="1" stop-color="#e2d3b2"/></radialGradient>
  <filter id="grana" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .32  0 0 0 0 .18  0 0 0 .18 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <filter id="tratto"><feTurbulence type="turbulence" baseFrequency=".03" numOctaves="2" seed="13"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
  <filter id="sfuma"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="nero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a302c"/><stop offset="1" stop-color="#17110f"/></linearGradient>
  <linearGradient id="nero2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a3c36"/><stop offset="1" stop-color="#211816"/></linearGradient>
  <radialGradient id="brace" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#f08a24"/><stop offset="1" stop-color="#b8321a"/></radialGradient>
  <linearGradient id="fiamma" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b8321a"/><stop offset=".6" stop-color="#f08a24"/><stop offset="1" stop-color="#ffd36a"/></linearGradient>
 </defs>
 <rect width="640" height="560" fill="url(#carta)"/>
 <rect width="640" height="560" fill="#000" filter="url(#grana)"/>
 <!-- fumo -->
 <g fill="#5d5450" opacity=".35" filter="url(#sfuma)"><ellipse cx="470" cy="190" rx="90" ry="40"/><ellipse cx="540" cy="140" rx="60" ry="30"/><ellipse cx="130" cy="150" rx="70" ry="30"/></g>
 <ellipse cx="330" cy="540" rx="230" ry="14" fill="#8a6a40" opacity=".3"/>
